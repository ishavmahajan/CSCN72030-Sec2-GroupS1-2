services:
  redis:
    image: redis:7-alpine
    container_name: kitchen-os-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kitchen-os-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: kitchenOS_Scada.Api/Dockerfile
      target: development

    container_name: kitchen-os-scada-api

    working_dir: /app/kitchenOS_Scada.Api


    volumes:
      - ./backend:/app
      - identity-keys:/var/lib/kitchenos/keys

    ports:
      - "8080:8080"

    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      Identity__BootstrapAdministrator__Email: ${IDENTITY_ADMIN_EMAIL:-}
      Identity__BootstrapAdministrator__Password: ${IDENTITY_ADMIN_PASSWORD:-}
      Security__KeyRingPath: /var/lib/kitchenos/keys
      Security__FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:3020}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

    restart: unless-stopped

  simulator:
    build:
      context: ./backend
      dockerfile: kitchenOS.Simulator/Dockerfile

    container_name: kitchen-os-simulator

    working_dir: /src/kitchenOS.Simulator

    volumes:
      - ./backend:/src

    depends_on:
      - redis

    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__Redis: redis:6379

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: kitchen-os-frontend
    working_dir: /app

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    ports:
      - "3020:3000"

    depends_on:
      - backend

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://backend:8080

    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    restart: unless-stopped

volumes:
  postgres-data:
  identity-keys:

