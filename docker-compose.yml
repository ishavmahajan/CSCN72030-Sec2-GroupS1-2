services:

  redis:
    image: redis:7-alpine

    container_name: kitchen-os-redis

    ports:
      - "6379:6379"

    restart: unless-stopped

  backend:
    build:
      context: ./backend/kitchenOS_Scada.Api
      dockerfile: Dockerfile
      target: development

    container_name: kitchen-os-scada-api

    working_dir: /app/kitchenOS_Scada.Api

    volumes:
      - ./backend:/app

    ports:
      - "8080:8080"

    depends_on:
      - redis

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__Redis: redis:6379

    restart: unless-stopped