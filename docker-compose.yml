services:
  redis:
    image: redis:7-alpine
    container_name: kitchen-os-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: kitchenOS_Scada.Api/Dockerfile
      target: development

    container_name: kitchen-os-scada-api

    working_dir: /app/kitchenOS_Scada.Api


    volumes:
      - ./backend:/app

    ports:
      - "8080:8080"

    depends_on:
      - redis

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__Redis: redis:6379

    restart: unless-stopped

  simulator:
    build:
      context: ./backend
      dockerfile: kitchenOS.Simulator/Dockerfile

    container_name: kitchen-os-simulator

    working_dir: /src/kitchenOS.Simulator

    volumes:
      - ./backend:/src

    depends_on:
      - redis

    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__Redis: redis:6379

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development

    container_name: kitchen-os-frontend
    working_dir: /app

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    ports:
      - "3020:3000"

    depends_on:
      - backend

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://backend:8080

    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    restart: unless-stopped
